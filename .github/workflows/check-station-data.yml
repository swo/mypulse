name: Check station data

# Verifies src/stations.json still matches WMATA's live GTFS static feed.
# Runs on every merge to main rather than on a schedule: if WMATA renames or
# removes a station/platform, this fails loudly so it gets noticed and fixed
# with `pnpm build-stations`, rather than silently auto-committing a change.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-station-data.mjs --check
        env:
          VITE_WMATA_API_KEY: ${{ secrets.WMATA_API_KEY }}
